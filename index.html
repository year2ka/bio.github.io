<!DOCTYPE html>
<html lang = "ru">
    <head>
        <title>bio year2ka</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            :root{
                --paper: #fff8ec;
                --sun: #ffd23f;
                --amber: #ffbf00;
                --graphite: #0E0F10;
            }
            * {box-sizing: border-box;}
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                background: linear-gradient(140deg, var(--sun), var(--paper))
            }
            .card {
                width: 100%;
                max-width: 420px;
                padding: 32px 28px;
                background: var(--paper);
                border-radius: 28px;
                text-align: center;
            }
            .avatar {
                width: 110px;
                height: 110px;
                background-color: var(--sun);
                font-size: 48px;
                margin: 0 auto 16px;
                display: grid;
                place-items: center;
                border: 4px solid var(--amber);
                border-radius: 50%;
            }
            h1 {
                margin: 0 0 6px;
                font-size: 2rem;
            }
            ul {
                display: flex;
                flex-direction: column;
                list-style: none;
                padding: 0;
                margin: 20px 0 26px;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }
            li {
                padding: 8px 14px;
                background-color: var(--sun);
                border: 3px solid var(--amber);
                border-radius: 8px;
                font-weight: bold;
                margin-bottom: 4px;
                color: var(--graphite);
                transition: transform 0.1s ease;
            }
            header { 
                font-weight: bold;
                color: var(--amber);
            }
            footer ul {
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap: 25px;
                padding: 0;
                list-style: none;
                
            }
            footer a {
                display: inline-block;
                font-weight: bold;
                color: var(--graphite);
            }
            footer li:hover {
                transform: translateY(-2px);
            }
        </style>
    </head>

    <body>
        <header>
            <h1>sup</h1>
        </header>

        <main class="card">
            <div class="avatar">🤠</div>
            <h1>im year2ka</h1>
            <p class="description">student who sold the world</p>

            <ul>
                <li>Web-design🌐</li>
                <li>Games🎮</li>
                <li>Basketball🏀</li>
            </ul>
        </main>

        <footer>
            <ul>
                <li><a id="github-link" href="https://github.com/year2ka" target="_blank">github</a></li>
                <li><a id="steam-link" href="https://steamcommunity.com/profiles/76561199381733720" target="_blank">steam</a></li>
            </ul>
        </footer>
    </body>
</html>
