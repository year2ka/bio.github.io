<!DOCTYPE html>
<html lang = "ru">
    <head>
        <title>BIO year2ka</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <style>
        :root{
            --paper: #fff8ec;
            --sun: #ffd23f;
            --amber: #ffbf00;
        }
        * {box-sizing: border-box;}
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(140deg, var(--sun), var(--paper))
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            background: var(--paper);
            border-radius: 28px;
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            background-color: var(--sun);
            font-size: 48px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border: 4px solid var(--amber);
            border-radius: 50%;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 2rem;
        }
    </style>

    <body>
        <main class="card">
            <div class="avatar">🤠</div>
            <h1>sup, im year2ka</h1>
            <p class="description">student, who sold the world</p>
        </main>
    </body>
</html>
